name: SystemShield CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate Python build and packaging
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r build/requirements-build.txt

      - name: Python compile check
        run: python -m compileall -q main.py core build

      - name: Generate build metadata
        run: python build/write_build_metadata.py

      - name: Build PyInstaller package
        run: ./build/build-pyinstaller.ps1

      - name: Read application version
        id: meta
        run: |
          $version = python -c "from core.version import VERSION; print(VERSION)"
          "version=$version" >> $env:GITHUB_OUTPUT
          "artifact_name=SystemShield-v$version-ci" >> $env:GITHUB_OUTPUT

      - name: Validate packaged outputs
        run: |
          $required = @(
            "docs/systemshield-version-info.txt",
            "docs/release-notes.md",
            "dist/SystemShield.exe"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing expected build output: $path"
            }
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: |
            dist/SystemShield.exe
            docs/release-notes.md
            docs/systemshield-version-info.txt
